<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>stylewx 编辑器</title>
<style>
  :root{
    --bg:#f3f4f7; --panel:#fff; --line:#e8eaee; --line2:#f0f2f5;
    --ink:#23272e; --ink2:#4b5058; --muted:#98a0ab; --faint:#c4cbd4;
    --brand:#2563eb; --brand-d:#1d4ed8; --brand-sub:#e9f0ff;
    --ok:#12a150; --err:#e5484d; --warn:#b4690e;
    --sidebar-w:236px; --radius:14px; --radius-sm:10px;
    --shadow:0 8px 30px rgba(20,30,50,.06), 0 1px 2px rgba(20,30,50,.04);
    --shadow-lg:0 16px 46px rgba(20,30,50,.10);
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  button{font:inherit}
  .app{display:flex;gap:14px;padding:14px;height:100vh}

  /* ---------- 左侧栏 ---------- */
  .sidebar{width:var(--sidebar-w);flex:none;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .side-top{display:flex;align-items:center;gap:9px;padding:16px 16px 14px}
  .logo{width:28px;height:28px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 10px rgba(37,99,235,.3)}
  .side-brand{font-weight:700;font-size:14px}
  .side-brand small{color:var(--muted);font-weight:400;margin-left:6px;font-size:11px}
  .new-btn{margin:4px 14px 16px;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--brand);color:#fff;border:0;border-radius:var(--radius-sm);padding:11px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(37,99,235,.28);transition:.15s}
  .new-btn:hover{background:var(--brand-d);transform:translateY(-1px)}
  .subnav{padding:0 12px 12px;display:flex;flex-direction:column;gap:3px}
  .subnav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:9px 10px;font-size:13px;color:var(--ink2);cursor:pointer;transition:.12s}
  .subnav button:hover{background:#f2f4f7}
  .subnav button.active{background:var(--brand-sub);color:var(--brand);font-weight:600}
  .side-label{padding:10px 18px 6px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
  .history{flex:1;overflow:auto;padding:0 12px 14px}
  .hist-search{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 11px;font-size:12px;margin-bottom:8px;background:#fbfcfe;color:var(--ink)}
  .hist-search::placeholder{color:var(--faint)}
  .hist-item{padding:10px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .hist-item:hover{background:#f2f4f7}
  .hist-item .h-title{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  .hist-item .h-meta{font-size:11px;color:var(--muted);margin-top:2px}
  .side-foot{padding:12px 18px;border-top:1px solid var(--line2);font-size:11px;color:var(--muted)}

  /* ---------- 主区 ---------- */
  .main{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
  .topbar{display:flex;align-items:center;gap:8px;padding:11px 16px;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);flex-wrap:nowrap}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--radius-sm);padding:7px 12px;font-size:12.5px;cursor:pointer;transition:.12s;white-space:nowrap;box-shadow:0 1px 2px rgba(20,30,50,.03)}
  .btn:hover{background:#f4f6f9;border-color:#dde1e7}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.26)}
  .btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
  .btn.ghost{border:none;background:none;color:var(--muted);box-shadow:none}
  .btn.ghost:hover{background:#f2f4f7;color:var(--ink)}
  .grow{flex:1}
  .topbar .lbl{font-size:12px;color:var(--muted)}
  select,input[type=text]{border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 10px;font-size:12.5px;background:#fff;color:var(--ink);outline:none;box-shadow:0 1px 2px rgba(20,30,50,.03)}
  select:focus,input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  input#title{width:170px}
  details.theme-panel{position:relative}
  details.theme-panel summary{cursor:pointer;padding:7px 12px;font-size:12.5px;border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--muted);box-shadow:0 1px 2px rgba(20,30,50,.03)}
  .theme-box{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px;width:260px;z-index:30}
  .theme-box h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600}

  /* ---------- 内容区 ---------- */
  .content{flex:1;display:flex;gap:14px;min-height:0}
  .editor-pane{width:50%;min-width:0;display:flex;flex-direction:column;border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
  .preview-pane{width:50%;min-width:0;display:flex;flex-direction:column;border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
  .pane-toolbar{display:flex;align-items:center;gap:2px;padding:9px 12px;border-bottom:1px solid var(--line2);background:#fff;flex-wrap:wrap}
  .tb-btn{width:29px;height:29px;border:0;border-radius:8px;background:none;color:var(--ink2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
  .tb-btn:hover{background:#eef1f5;color:var(--ink)}
  .tb-btn b{font-weight:700}
  .tb-sep{width:1px;height:16px;background:var(--line);margin:0 5px}
  .markdown{flex:1;width:100%;border:0;resize:none;padding:22px 26px;font:14px/1.8 var(--mono);background:#fff;color:var(--ink);outline:none}
  .markdown::placeholder{color:var(--faint)}
  .ed-status{display:flex;gap:18px;padding:9px 20px;border-top:1px solid var(--line2);font-size:12px;color:var(--muted);background:#fff}
  .preview-head{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--ink2);background:#fff}
  .preview-head .tab{padding:5px 13px;border-radius:8px;cursor:pointer}
  .preview-head .tab.active{background:var(--brand-sub);color:var(--brand);font-weight:600}
  .preview-wrap{flex:1;overflow:auto;background:#eef1f5;padding:20px;display:flex;justify-content:center}
  iframe.preview{width:390px;min-height:100%;border:0;background:#fff;border-radius:16px;box-shadow:0 10px 34px rgba(20,30,50,.12);align-self:flex-start}
  .val-bar{padding:9px 16px;border-top:1px solid var(--line2);font-size:12px;color:var(--muted);background:#fbfcfe;white-space:pre-wrap;max-height:110px;overflow:auto}
  .val-bar .ok{color:var(--ok)} .val-bar .err{color:var(--err)} .val-bar .warn{color:var(--warn)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2329;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.2)}
  .toast.show{opacity:1}
  .empty{color:#b9c0c9;padding:30px;text-align:center;font-size:12px}
  /* 设置弹窗 */
  .overlay{position:fixed;inset:0;background:rgba(20,24,31,.4);display:none;align-items:center;justify-content:center;z-index:80}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:420px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.22);overflow:hidden}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
  .modal-head b{font-size:14px}
  .modal-close{border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer}
  .modal-body{padding:16px 18px;max-height:60vh;overflow:auto}
  .set-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
  .set-row:last-child{border-bottom:0}
  .set-row .s-txt{flex:1}
  .set-row .s-txt b{font-size:13px;display:block}
  .set-row .s-txt small{color:var(--muted);font-size:12px;line-height:1.5;display:block;margin-top:2px}
  .switch{position:relative;width:40px;height:22px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#cdd3db;border-radius:22px;transition:.2s}
  .slider:before{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
  .switch input:checked + .slider{background:var(--brand)}
  .switch input:checked + .slider:before{transform:translateX(18px)}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">
  <!-- 左侧栏 -->
  <aside class="sidebar">
    <div class="side-top">
      <div class="logo">M</div>
      <div class="side-brand">stylewx<small>排版</small></div>
    </div>
    <div class="subnav">
      <button class="active" id="navTheme">𖠘 文章主题</button>
      <button id="navImgHost">⚙ 图床设置</button>
      <button id="navAi">✨ AI 优化</button>
    </div>
    <button class="new-btn" id="newBtn">＋ 新建文章</button>
    <div class="side-label">历史记录</div>
    <div class="history">
      <input class="hist-search" id="search" placeholder="搜索…" />
      <div id="histList"></div>
    </div>
    <div class="side-foot">stylewx · v0.1.0 · 本地优先</div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <div class="topbar">
      <button class="btn ghost" id="undoBtn" title="撤销">↶</button>
      <button class="btn ghost" id="redoBtn" title="重做">↷</button>
      <span class="lbl">主题</span>
      <select id="themeSel" style="max-width:200px"></select>
      <details class="theme-panel" id="themePanel"><summary>主题库 ▾</summary><div class="theme-box"><h4>已保存的自定义主题</h4><div id="themeList" style="max-height:180px;overflow:auto;font-size:12px;color:var(--ink2);line-height:1.9"></div></div></details>
      <button class="btn" id="genBtn" title="按当前文章用 AI 生成主题">✨ 生成主题</button>
      <button class="btn" id="saveBtn">💾 保存主题</button>
      <button class="btn" id="valBtn">◉ 校验</button>
      <span class="grow"></span>
      <label class="lbl">标题</label><input type="text" id="title" placeholder="文章标题" />
      <button class="btn" id="copyHtmlBtn">📋 复制 HTML</button>
      <button class="btn primary" id="copyWxBtn">📄 复制到公众号</button>
      <button class="btn primary" id="pubBtn">🚀 发布草稿箱</button>
    </div>

    <div class="content">
      <!-- 中栏：编辑器 -->
      <section class="editor-pane">
        <div class="pane-toolbar" id="toolbar">
          <button class="tb-btn" data-a="bold" title="加粗"><b>B</b></button>
          <button class="tb-btn" data-a="italic" title="斜体"><i style="font-style:italic">I</i></button>
          <button class="tb-btn" data-a="strike" title="删除线"><s>S</s></button>
          <button class="tb-btn" data-a="h1" title="一级标题">H1</button>
          <button class="tb-btn" data-a="h2" title="二级标题">H2</button>
          <button class="tb-btn" data-a="h3" title="三级标题">H3</button>
          <span class="tb-sep"></span>
          <button class="tb-btn" data-a="quote" title="引用">❝</button>
          <button class="tb-btn" data-a="code" title="行内代码">⟨⟩</button>
          <button class="tb-btn" data-a="ul" title="无序列表">•≡</button>
          <button class="tb-btn" data-a="ol" title="有序列表">1≡</button>
          <button class="tb-btn" data-a="highlight" title="高亮">≡H</button>
          <span class="tb-sep"></span>
          <button class="tb-btn" data-a="link" title="链接">🔗</button>
          <button class="tb-btn" data-a="img" title="图片">🖼</button>
          <button class="tb-btn" data-a="table" title="表格">⊞</button>
          <button class="tb-btn" data-a="hr" title="分隔线">—</button>
          <span class="tb-sep"></span>
          <button class="tb-btn" data-a="clear" title="清除格式">⌫</button>
          <button class="tb-btn" data-a="help" title="Markdown 帮助">?</button>
        </div>
        <textarea class="markdown" id="md" spellcheck="false" placeholder="# 在这里输入 Markdown…"></textarea>
        <div class="ed-status"><span id="wc">字数 0</span><span id="rt">0 分钟阅读</span><span class="grow"></span><span id="saveState">就绪</span></div>
      </section>

      <!-- 右栏：预览 -->
      <section class="preview-pane">
        <div class="preview-head"><span class="tab active" id="p1">实时预览</span><span class="tab" id="p2">手机视图</span><span class="grow"></span><span style="color:var(--muted)">390px</span></div>
        <div class="preview-wrap" id="previewWrap"><div class="empty" id="pvEmpty">正在渲染…</div><iframe class="preview" id="pv" style="display:none"></iframe></div>
        <div class="val-bar" id="status">就绪。</div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- 图床设置弹窗 -->
<div class="overlay" id="imgHostOverlay">
  <div class="modal">
    <div class="modal-head"><b>图床设置</b><button class="modal-close" data-close>&times;</button></div>
    <div class="modal-body">
      <div class="set-row">
        <div class="s-txt"><b>发布时自动上传外链图到微信素材库</b><small>开启后会把正文里的外链图片搬运为微信 CDN（mmbiz.qpic.cn）链接，微信端才能显示；关闭则保留原外链 URL（可能无法显示）。</small></div>
        <label class="switch"><input type="checkbox" id="relocateOpt" checked><span class="slider"></span></label>
      </div>
      <div class="set-row">
        <div class="s-txt"><b>预览用图床</b><small>编辑器右侧预览使用本地 Chromium 渲染，不依赖网络图床；正式发布按上面开关处理。</small></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>关闭</button></div>
  </div>
</div>

<script>
// ---- 状态 ----
let lastHtml=''; let themesCache=[]; let currentTitle='';
let history=[]; // [{title, md, ts}]
const $=s=>document.querySelector(s);
const toast=(m,ok=true)=>{const t=$('#toast');t.textContent=m;t.className='toast show'+(ok?'':' err');setTimeout(()=>t.className='toast',2200);};

async function api(path, body){
  const opts=body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{};
  const r=await fetch(path,opts); const d=await r.json().catch(()=>({error:{message:'HTTP '+r.status}}));
  if(d.error) throw new Error(d.error.message||'请求失败');
  return d;
}

// ---- 主题 ---
async function loadThemes(){
  const d=await api('/editor/api/themes'); themesCache=d.themes||[];
  const saved=themesCache.filter(t=>t.origin==='saved'), presets=themesCache.filter(t=>t.origin!=='saved');
  const sel=$('#themeSel'); const keep=sel.value||(themesCache[0]&&themesCache[0].name); sel.innerHTML='';
  if(saved.length){const og=document.createElement('optgroup');og.label='我的主题';saved.forEach(t=>og.appendChild(new Option(t.name,t.name)));sel.appendChild(og);}
  const pg=document.createElement('optgroup');pg.label='预置主题';presets.forEach(t=>pg.appendChild(new Option(t.name,t.name)));sel.appendChild(pg);
  if(keep)sel.value=keep; else if(themesCache[0])sel.value=themesCache[0].name;
  $('#themeList').innerHTML=saved.length?saved.map(t=>'<div>• '+t.name+'</div>').join(''):'<div>暂无（用「生成/保存主题」加入）</div>';
  return sel.value;
}

// ---- 渲染 (防抖) ---
let timer;
async function render(){
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    const markdown=$('#md').value, theme=$('#themeSel').value;
    try{
      const d=await api('/editor/api/render',{markdown,theme});
      lastHtml=d.html;
      $('#pv').srcdoc=d.html; $('#pv').style.display=''; $('#pvEmpty').style.display='none';
      const c=markdown.replace(/\s+/g,''); $('#wc').textContent='字数 '+c.length;
      $('#rt').textContent=Math.max(1,Math.round(c.length/400))+' 分钟阅读';
      const v=d.validation||{}; const issues=(v.issues||[]).map(i=>'['+i.rule+'] '+i.message);
      setVal([{kind:v.pass?'ok':'err',text:(v.pass?'✓ 渲染完成 · 校验通过':'✗ 校验未通过')+' · HTML '+d.html.length+' 字'},...issues.map(t=>({kind:v.pass?'warn':'err',text:t}))]);
    }catch(e){ setVal([{kind:'err',text:'渲染失败：'+e.message}]); }
  },300);
}
function setVal(lines){ $('#status').innerHTML=lines.map(l=>'<span class="'+l.kind+'">'+l.text+'</span>').join('\n'); }

// ---- 工具栏 ----
function wrap(before,after=before){
  const ta=$('#md'), s=ta.selectionStart, e=ta.selectionEnd, v=ta.value;
  const sel=v.slice(s,e)||'文本';
  const nv=v.slice(0,s)+before+sel+after+v.slice(e);
  ta.value=nv; ta.selectionStart=s+before.length; ta.selectionEnd=s+before.length+sel.length; ta.focus(); render(); saveSnap();
}
function linePrefix(p){
  const ta=$('#md'), s=ta.selectionStart, e=ta.selectionEnd, v=ta.value;
  const ls=v.lastIndexOf('\n',s-1)+1, le=v.indexOf('\n',e); const end=le<0?v.length:le;
  const block=v.slice(ls,end); const nvBlock=block.split('\n').map(l=>p+l).join('\n');
  ta.value=v.slice(0,ls)+nvBlock+v.slice(end); ta.selectionStart=ls; ta.selectionEnd=ls+nvBlock.length; ta.focus(); render(); saveSnap();
}
const ACTIONS={
  bold:()=>wrap('**'), italic:()=>wrap('*'), strike:()=>wrap('~~'), highlight:()=>wrap('=='),
  code:()=>wrap('`'), link:()=>wrap('[','](https://)'), img:()=>wrap('![','](https://)'),
  h1:()=>linePrefix('# '), h2:()=>linePrefix('## '), h3:()=>linePrefix('### '),
  quote:()=>linePrefix('> '), ul:()=>linePrefix('- '), ol:()=>linePrefix('1. '),
  hr:()=>{const ta=$('#md');ta.value=(ta.value+'\n\n---\n');render();},
  table:()=>{const ta=$('#md');const t='\n| 列A | 列B |\n| --- | --- |\n| 1 | 2 |\n';ta.value+=t;render();},
  clear:()=>{const ta=$('#md');const s=ta.selectionStart,e=ta.selectionEnd;ta.value=ta.value.slice(0,s)+ta.value.slice(e);render();},
  help:()=>toast('Markdown 支持：**加粗**、*斜体*、==高亮==、> 引用、- 列表、| 表格 |、`代码`、```代码块```'),
};
$('#toolbar').addEventListener('click',e=>{const a=e.target.closest('.tb-btn')?.dataset?.a;if(a&&ACTIONS[a])ACTIONS[a]();});

// ---- 历史记录 (localStorage) ----
function saveSnap(){ if(!$('#md').value.trim())return; currentTitle=$('#title').value||((($('#md').value.match(/^#\s+(.+)$/m)||[])[1])||'未命名'); const item={title:currentTitle,md:$('#md').value,ts:Date.now()}; const idx=history.findIndex(h=>h.md===item.md); if(idx>=0)history[idx]=item; else history.unshift(item); history=history.slice(0,20); localStorage.setItem('mp-history',JSON.stringify(history)); renderHistory(); $('#saveState').textContent='已自动保存'; setTimeout(()=>$('#saveState').textContent='就绪',1200); }
function renderHistory(filter){ const list=history.filter(h=>!filter||h.title.includes(filter)||h.md.includes(filter)); $('#histList').innerHTML=list.length?list.map(h=>'<div class="hist-item" data-i="'+history.indexOf(h)+'"><div class="h-title">'+esc(h.title)+'</div><div class="h-meta">'+new Date(h.ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</div></div>').join(''):'<div class="empty">暂无历史</div>'; }
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
$('#histList').addEventListener('click',e=>{const i=e.target.closest('.hist-item')?.dataset?.i;if(i!=null){const h=history[i];$('#md').value=h.md;$('#title').value=h.title;render();}});
$('#search').addEventListener('input',e=>renderHistory(e.target.value.trim()));

// ---- 新建 ----
$('#newBtn').onclick=()=>{ $('#md').value=''; $('#title').value=''; $('#pv').srcdoc=''; $('#pv').style.display='none'; $('#pvEmpty').style.display=''; setVal([{kind:'warn',text:'新建文章：开始输入 Markdown'} ]); $('#md').focus(); };

// ---- 主题操作 ----
$('#genBtn').onclick=async()=>{ toast('正在生成主题（LLM）…'); try{ const d=await api('/editor/api/generate',{article:$('#md').value,save:true}); if(d.theme&&d.theme.name){await loadThemes();$('#themeSel').value=d.theme.name;} toast('已生成'+(d.saved?'并保存':'')+'：'+(d.theme&&d.theme.name)); render(); }catch(e){ toast('生成失败：'+e.message,false); } };
$('#saveBtn').onclick=async()=>{ const name=$('#themeSel').value; const th=themesCache.find(t=>t.name===name); if(!th)return toast('请先选择主题',false); try{ await api('/editor/api/savetheme',{theme:th}); await loadThemes(); $('#themeSel').value=name; toast('已保存：'+name); }catch(e){ toast('保存失败：'+e.message,false); } };
$('#valBtn').onclick=async()=>{ const md=$('#md').value,theme=$('#themeSel').value; try{ const d=await api('/editor/api/render',{markdown:md,theme}); const v=d.validation||{}; const issues=(v.issues||[]).map(i=>'['+i.rule+'] '+i.message); setVal([{kind:v.pass?'ok':'err',text:v.pass?'✓ 校验通过':'✗ 校验未通过'},...issues.map(t=>({kind:v.pass?'warn':'err',text:t}))]); toast(v.pass?'校验通过':'校验未通过',v.pass); }catch(e){ toast('校验失败：'+e.message,false); } };

// ---- 复制 / 发布 ----
async function copyText(t,msg){ try{ await navigator.clipboard.writeText(t); toast(msg); }catch(e){ toast('复制失败（浏览器限制）：'+e.message,false); } }
$('#copyHtmlBtn').onclick=()=> lastHtml?copyText(lastHtml,'已复制 HTML'):toast('请先渲染',false);
$('#copyWxBtn').onclick=()=> lastHtml?copyText(lastHtml,'已复制，去公众号编辑器粘贴'):toast('请先渲染',false);
$('#pubBtn').onclick=async()=>{ const title=$('#title').value||((($('#md').value.match(/^#\s+(.+)$/m)||[])[1])||'未命名'); toast('正在发布草稿箱…'); try{ const d=await api('/editor/api/publish',{markdown:$('#md').value,title,theme:$('#themeSel').value,relocate:$('#relocateOpt').checked}); toast('已发布 media_id='+(d.media_id||'').slice(0,20)+'…'); setVal([{kind:'ok',text:'✅ 已发布草稿 media_id='+d.media_id}]); saveSnap(); }catch(e){ toast('发布失败：'+e.message,false); } };

// ---- 侧栏导航 / 设置 / AI 优化 ----
function nav(id){ document.querySelectorAll('.subnav button').forEach(b=>b.classList.remove('active')); var b=document.getElementById(id); if(b)b.classList.add('active'); }
$('#navTheme').onclick=()=>{ nav('navTheme'); $('#themePanel').open=true; $('#themeSel').focus(); };
$('#navImgHost').onclick=()=>{ nav('navImgHost'); $('#imgHostOverlay').classList.add('show'); };
$('#navAi').onclick=async()=>{ nav('navAi'); if(!$('#md').value.trim())return toast('请先输入文章',false); toast('AI 优化中（LLM）…'); try{ const d=await api('/editor/api/optimize',{markdown:$('#md').value}); $('#md').value=d.markdown; saveSnap(); render(); toast('AI 优化完成'); }catch(e){ toast('AI 优化失败：'+e.message,false); } };
// 设置弹窗：开关
const relocateToggle=$('#relocateOpt'); relocateToggle.checked=localStorage.getItem('mp-relocate')!=='0'; relocateToggle.addEventListener('change',()=>localStorage.setItem('mp-relocate',relocateToggle.checked?'1':'0'));
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ $('#imgHostOverlay').classList.remove('show'); });
$('#imgHostOverlay').addEventListener('click',e=>{ if(e.target.id==='imgHostOverlay') $('#imgHostOverlay').classList.remove('show'); });

// ---- 标签切换 (实时预览 / 手机视图) ----
$('#p1').onclick=()=>{ $('#p1').classList.add('active'); $('#p2').classList.remove('active'); $('#previewWrap').style.display=''; $('#pv').style.width='390px'; };
$('#p2').onclick=()=>{ $('#p2').classList.add('active'); $('#p1').classList.remove('active'); $('#pv').style.width='100%'; };

// ---- 事件 ----
$('#themeSel').addEventListener('change',render);
$('#md').addEventListener('input',()=>{render();saveSnap();});
$('#title').addEventListener('input',saveSnap);
$('#undoBtn').onclick=()=>document.execCommand('undo');
$('#redoBtn').onclick=()=>document.execCommand('redo');

// ---- 启动 ----
(async()=>{
  history=JSON.parse(localStorage.getItem('mp-history')||'[]'); renderHistory();
  const saved=history[0]; if(saved){ $('#md').value=saved.md; $('#title').value=saved.title; }
  else { $('#md').value='# 示例标题\n\n在这里用 Markdown 写作。支持 **加粗**、*斜体*、==高亮==、> 引用、列表、表格、代码块等。\n\n## 小节一\n\n> 引用一条。\n\n- 要点一\n- 要点二\n\n| 列A | 列B |\n| --- | --- |\n| 1 | 2 |\n'; }
  await loadThemes(); render();
})().catch(e=>setVal([{kind:'err',text:'初始化失败：'+e.message}]));
</script>
</body>
</html>
